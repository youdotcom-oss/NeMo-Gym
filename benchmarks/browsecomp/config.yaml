browsecomp_benchmark_resources_server:
  resources_servers:
    browsecomp_advanced_harness:
      entrypoint: app.py
      domain: agent
      debug: false
      # Search/browse backend: "you" (default), "tavily", or "exa". Override per-run with
      # ++...browsecomp_advanced_harness.search_provider=exa (+ export EXA_API_KEY=...).
      # Keys resolve from the environment at config load, never via ++ overrides,
      # which would put the secret in argv where any ps on the box can read it.
      search_provider: you
      ydc_api_key: ${oc.decode:${oc.env:YDC_API_KEY,null}}
      tavily_api_key: ${oc.decode:${oc.env:TAVILY_API_KEY,null}}
      # terminal mode: search/browse write pages to a per-session disk workspace
      # and the read-only bash_command tool is exposed for the model to grep/read them.
      workspace: per_session
      use_judge: true
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
      verified: false

browsecomp_benchmark_agent:
  responses_api_agents:
    browsecomp_agent:
      entrypoint: app.py
      max_steps: 400
      keep_rounds: 9999
      nudge_steps: true
      max_context_tokens: 196608
      context_reset_pct: 0.3
      # token-based reset; >0 overrides max_context_tokens*context_reset_pct. Raised
      # from 50000: with resets now actually firing (see below), 50k capped working
      # context at ~1/4 of max_context_tokens. 120000 leaves headroom for one
      # generation plus tool schemas above the threshold.
      context_reset_tokens: 120000
      context_reset_keep_rounds: 3
      max_run_retries: 3
      max_reset_count: null
      # Set to a directory to record per-reset + final conversation snapshots
      # under {snap_dir}/sample_{task_index}/attempt_{attempt}_*.jsonl. Off when null.
      snap_dir: null
      # Estimate prompt tokens via the vLLM /tokenize endpoint before each model
      # call to decide context reset (skips the otherwise-wasted generation).
      # Off here: no /tokenize endpoint on W&B Inference (see the recipe scripts'
      # ++$AGENT.save_model_call_using_vllm_tokenize_endpoint=false), so the
      # post-call fallback check below is the only reset path in practice.
      save_model_call_using_vllm_tokenize_endpoint: true
      # Durable progress board pinned to the system prompt, survives context resets.
      # Was off: resets fired with nothing surviving them but 3 rounds, so a long
      # trajectory re-derived the same findings after every reset. See app.py.
      progress: true
      resources_server:
        type: resources_servers
        name: browsecomp_benchmark_resources_server
      model_server:
        type: responses_api_models
#        name: policy_model_no_interleaved_reasoning
        name: policy_model
      datasets:
      - name: browsecomp
        type: benchmark
        jsonl_fpath: benchmarks/browsecomp/data/browsecomp_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/browsecomp/prepare.py
        num_repeats: 1